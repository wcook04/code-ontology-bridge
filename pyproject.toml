[project]
name = "code-ontology-bridge"
version = "0.1.0"
description = "Extract Python source into relational data and semantic models for NVIDIA Auto Ontology."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
cob = "code_ontology_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_ontology_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pandas>=3.1.0",
    "pgserver>=0.1.4 ; python_full_version < '3.13'",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "code_ontology_bridge", "tests", "eval", "examples", "docs", "tools", ".github",
    "README.md", "CONTRIBUTING.md", "SPEC.md", "GAPS.md", "LICENSE", "pyproject.toml",
    "uv.lock", ".gitignore", ".python-version",
]
exclude = [
    "**/__pycache__/**", "**/.pytest_cache/**", "**/.venv/**", "**/.env*",
    "**/.pgdata*/**", "**/.work/**", "**/cert/**", "**/*.duckdb", "**/*.duckdb.wal",
]
