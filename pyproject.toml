[project]
name = "code-ontology-bridge"
version = "0.1.0"
description = "Give NVIDIA Auto Ontology an ontology of a codebase through the entry points it already has."
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
cob = "code_ontology_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_ontology_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pandas>=3.1.0",
    "pgserver>=0.1.4 ; python_full_version < '3.13'",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
]
