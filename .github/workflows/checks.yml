name: Checks
on: [push, pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q -ra
      - run: uv run python tools/check_repository.py --index
      - run: uv build
