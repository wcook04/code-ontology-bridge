      - id: cob:httpx_code:table:code.reachability
        name: reachability
        description: 'Transitive callers: one row per pair (caller, target) where a chain of call edges leads from the caller
          to the target, with the length of the shortest chain. direct_depth follows direct calls only and is null when the
          target is reachable only through a callback reference; any_depth also follows callback references. The chain length
          is unbounded and cycles are handled. A symbol is never listed as reaching itself. Use this view for ''directly or
          indirectly'', ''transitively'', ''can reach'', ''impact of changing'' and shortest-depth questions instead of writing
          a recursive query.'
        pk:
        - cob:httpx_code:column:code.reachability.caller_symbol_id
        - cob:httpx_code:column:code.reachability.target_symbol_id
        type: VIEW
        columns:
        - id: cob:httpx_code:column:code.reachability.caller_symbol_id
          name: caller_symbol_id
          description: Symbol from which a chain of calls reaches the target.
          type: VARCHAR
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: cob:httpx_code:column:code.reachability.target_symbol_id
          name: target_symbol_id
          description: Symbol reached.
          type: VARCHAR
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: cob:httpx_code:column:code.reachability.direct_depth
          name: direct_depth
          description: Edges in the shortest chain of direct calls from caller to target (1 = calls it directly); null when
            every chain needs a callback reference.
          type: INTEGER
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: cob:httpx_code:column:code.reachability.any_depth
          name: any_depth
          description: Edges in the shortest chain when callback references also count as edges; never larger than direct_depth.
          type: INTEGER
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: cob:httpx_code:column:code.reachability.caller_kind
          name: caller_kind
          description: 'function, method or class: kind of the caller.'
          type: VARCHAR
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: cob:httpx_code:column:code.reachability.caller_file_id
