          description: File that defines the caller.
          type: VARCHAR
          sample_values: []
          is_nullable: true
          is_unique: false
        - id: cob:httpx_code:column:code.reachability.caller_in_test_file
          name: caller_in_test_file
          description: True when the caller is defined in a test file.
          type: BOOLEAN
          sample_values: []
          is_nullable: true
          is_unique: false
