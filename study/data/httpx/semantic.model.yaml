    - id: cob:httpx_code:attribute:code.snapshot.commit_sha
      name: commit sha
      description: Commit SHA of the analysed checkout.
      column_id: cob:httpx_code:column:code.snapshot.commit_sha
    - id: cob:httpx_code:attribute:code.snapshot.built_at
      name: built at
      description: UTC time the map was built, ISO 8601 (SOURCE_DATE_EPOCH when set).
      column_id: cob:httpx_code:column:code.snapshot.built_at
    - id: cob:httpx_code:attribute:code.snapshot.builder_version
      name: builder version
      description: Name and version of the builder that produced the rows.
      column_id: cob:httpx_code:column:code.snapshot.builder_version
    - id: cob:httpx_code:attribute:code.snapshot.source_fingerprint
      name: source fingerprint
      description: 16-hex SHA-256 digest over sorted 'path NUL file-sha256' lines of every analysed file.
      column_id: cob:httpx_code:column:code.snapshot.source_fingerprint
    - id: cob:httpx_code:attribute:code.snapshot.file_count
      name: file count
      description: Number of Python files analysed.
      column_id: cob:httpx_code:column:code.snapshot.file_count
    - id: cob:httpx_code:attribute:code.snapshot.omitted_file_count
      name: omitted file count
      description: Number of Python files found but not analysed (excluded or unparseable).
      column_id: cob:httpx_code:column:code.snapshot.omitted_file_count
    - id: cob:httpx_code:attribute:code.snapshot.known_limits
      name: known limits
      description: JSON array of plain-language limits of the static analysis.
      column_id: cob:httpx_code:column:code.snapshot.known_limits
  - id: cob:httpx_code:term:files
    name: Source file
    description: One row per analysed Python source file. Module and package descriptions are in files.description; a package
      description belongs to its __init__.py row.
    represents:
    - cob:httpx_code:table:code.files
    columns_attributes:
    - id: cob:httpx_code:attribute:code.files.file_id
      name: file id
      description: Repository-relative path of the file, with forward slashes.
      column_id: cob:httpx_code:column:code.files.file_id
    - id: cob:httpx_code:attribute:code.files.package
      name: package
      description: Dotted name of the package that contains the module; empty for a top-level module.
      column_id: cob:httpx_code:column:code.files.package
    - id: cob:httpx_code:attribute:code.files.module
      name: module
      description: Dotted import name of the module (a package's __init__.py has the package's name).
      column_id: cob:httpx_code:column:code.files.module
    - id: cob:httpx_code:attribute:code.files.is_test
      name: is test
      description: True when the path or file name marks the file as a test (tests/ or test/ directory, test_*.py, *_test.py,
        conftest.py).
      column_id: cob:httpx_code:column:code.files.is_test
    - id: cob:httpx_code:attribute:code.files.line_count
      name: line count
      description: Number of lines in the file.
      column_id: cob:httpx_code:column:code.files.line_count
    - id: cob:httpx_code:attribute:code.files.sha256
      name: sha256
      description: SHA-256 of the file's bytes; used to detect stale certifications.
      column_id: cob:httpx_code:column:code.files.sha256
    - id: cob:httpx_code:attribute:code.files.description
      name: description
      description: Verbatim description from the module docstring; empty when the file has none.
      column_id: cob:httpx_code:column:code.files.description
    - id: cob:httpx_code:attribute:code.files.description_source
      name: description source
      description: 'Where the description came from: heading_purpose, module_docstring or none.'
      column_id: cob:httpx_code:column:code.files.description_source
    - id: cob:httpx_code:attribute:code.files.has_fixed_headings
      name: has fixed headings
      description: True when the module docstring uses the fixed headings [PURPOSE], [INTERFACE], [FLOW], [DEPENDENCIES] or
        [CONSTRAINTS].
      column_id: cob:httpx_code:column:code.files.has_fixed_headings
  - id: cob:httpx_code:term:headings
    name: Docstring heading
    description: Optional fixed sections and contract atoms from module docstrings only. This table can be empty even when
      ordinary module and function docstrings exist. Function docstrings are in symbols.summary, not this table.
    represents:
    - cob:httpx_code:table:code.headings
    columns_attributes:
    - id: cob:httpx_code:attribute:code.headings.heading
      name: heading
      description: Heading name such as [PURPOSE], or an atom name such as Teleology or Fails.
      column_id: cob:httpx_code:column:code.headings.heading
    - id: cob:httpx_code:attribute:code.headings.value
      name: value
      description: Verbatim text under the heading or after the atom.
      column_id: cob:httpx_code:column:code.headings.value
    - id: cob:httpx_code:attribute:code.headings.ordinal
      name: ordinal
      description: Position of the heading within the file's docstring, from 1.
      column_id: cob:httpx_code:column:code.headings.ordinal
  - id: cob:httpx_code:term:symbols
    name: Code symbol
    description: Functions, methods and classes, their definition locations and extracted docstring summaries. Use this table
      for function definitions and function docstring questions.
    represents:
    - cob:httpx_code:table:code.symbols
    columns_attributes:
    - id: cob:httpx_code:attribute:code.symbols.symbol_id
      name: symbol id
      description: 'ID: file path, ''::'', qualified name; repeated qualified definitions append @L<definition-line>.'
      column_id: cob:httpx_code:column:code.symbols.symbol_id
    - id: cob:httpx_code:attribute:code.symbols.name
      name: name
      description: Bare name of the symbol.
      column_id: cob:httpx_code:column:code.symbols.name
    - id: cob:httpx_code:attribute:code.symbols.qualname
      name: qualname
      description: Dotted name within the module, e.g. Class.method.
      column_id: cob:httpx_code:column:code.symbols.qualname
    - id: cob:httpx_code:attribute:code.symbols.kind
      name: kind
      description: function, method or class.
      column_id: cob:httpx_code:column:code.symbols.kind
    - id: cob:httpx_code:attribute:code.symbols.line_start
      name: line start
      description: First line of the definition, decorators excluded.
      column_id: cob:httpx_code:column:code.symbols.line_start
    - id: cob:httpx_code:attribute:code.symbols.line_end
      name: line end
      description: Last line of the definition.
      column_id: cob:httpx_code:column:code.symbols.line_end
    - id: cob:httpx_code:attribute:code.symbols.is_public
      name: is public
      description: True when neither the name nor any enclosing class name starts with an underscore.
      column_id: cob:httpx_code:column:code.symbols.is_public
    - id: cob:httpx_code:attribute:code.symbols.summary
      name: summary
      description: First paragraph (or Teleology atom) of this function, method or class docstring, with whitespace normalized;
        empty when absent. This is the function documentation, unlike optional module headings.
      column_id: cob:httpx_code:column:code.symbols.summary
    - id: cob:httpx_code:attribute:code.symbols.summary_source
      name: summary source
      description: docstring or none.
      column_id: cob:httpx_code:column:code.symbols.summary_source
  - id: cob:httpx_code:term:class_bases
    name: Class base
    description: Base classes named in each class statement, in order, with the internal class each one resolves to.
    represents:
    - cob:httpx_code:table:code.class_bases
    columns_attributes:
    - id: cob:httpx_code:attribute:code.class_bases.ordinal
      name: ordinal
      description: Position of the base in the class statement, from 1.
      column_id: cob:httpx_code:column:code.class_bases.ordinal
    - id: cob:httpx_code:attribute:code.class_bases.base_name
      name: base name
      description: Base expression as written, e.g. SQLDatabase, base.SQLDatabase or Generic[T].
      column_id: cob:httpx_code:column:code.class_bases.base_name
  - id: cob:httpx_code:term:calls
    name: Call site
    description: Call edges inside functions, methods and class bodies, with how the callee was resolved. Direct call sites
      are all kept; those without an internal callee have a null callee and are classified as builtin, external, dynamic_attribute
      or unresolved. Callback rows record an internal function or method passed by reference as an argument to another call,
      e.g. asyncio.to_thread(f, x).
    represents:
    - cob:httpx_code:table:code.calls
    columns_attributes:
    - id: cob:httpx_code:attribute:code.calls.call_id
      name: call id
      description: 'Stable id: file path, line, column and a sequence number (for a callback row, the position of the argument).'
      column_id: cob:httpx_code:column:code.calls.call_id
    - id: cob:httpx_code:attribute:code.calls.callee_name
      name: callee name
      description: Callee as written at the call site, e.g. self.save or pd.read_csv; for a callback row, the reference as
        written in the argument.
      column_id: cob:httpx_code:column:code.calls.callee_name
    - id: cob:httpx_code:attribute:code.calls.line
      name: line
      description: Line of the call.
      column_id: cob:httpx_code:column:code.calls.line
    - id: cob:httpx_code:attribute:code.calls.resolution
      name: resolution
      description: same_file, imported or method_on_self (internal callee found); builtin (a Python builtin such as len);
        external (rooted in a third-party or standard-library import, or a module-level name assigned from one, e.g. logger);
        dynamic_attribute (a method on an object whose type is not statically known, e.g. row.get); unresolved (anything else).
      column_id: cob:httpx_code:column:code.calls.resolution
    - id: cob:httpx_code:attribute:code.calls.confidence
      name: confidence
      description: 'high or low: low for inherited methods, callback rows, dynamic_attribute and unresolved.'
      column_id: cob:httpx_code:column:code.calls.confidence
    - id: cob:httpx_code:attribute:code.calls.call_kind
      name: call kind
      description: direct (the call site invokes the callee) or callback (an internal function or method passed as an argument,
        e.g. asyncio.to_thread(f, x), executor.submit(f) or Thread(target=f), which the receiving call is expected to invoke).
        Callback rows always carry a callee and low confidence.
      column_id: cob:httpx_code:column:code.calls.call_kind
  - id: cob:httpx_code:term:imports
    name: Import statement
    description: Import statements, one row per imported name, with the internal file each resolves to.
    represents:
    - cob:httpx_code:table:code.imports
    columns_attributes:
    - id: cob:httpx_code:attribute:code.imports.import_id
      name: import id
      description: 'Stable id: file path, line and a sequence number.'
      column_id: cob:httpx_code:column:code.imports.import_id
    - id: cob:httpx_code:attribute:code.imports.module_name
      name: module name
      description: Absolute dotted module name imported (relative imports resolved).
      column_id: cob:httpx_code:column:code.imports.module_name
    - id: cob:httpx_code:attribute:code.imports.line
      name: line
      description: Line of the import statement.
      column_id: cob:httpx_code:column:code.imports.line
    - id: cob:httpx_code:attribute:code.imports.is_internal
      name: is internal
      description: True when the module belongs to the analysed repository.
      column_id: cob:httpx_code:column:code.imports.is_internal
  - id: cob:httpx_code:term:test_links
    name: Test link
    description: Static associations between a test file and a source file, inferred because the test imports the file or
      its name matches. They are not measured test execution or coverage.
    represents:
    - cob:httpx_code:table:code.test_links
    columns_attributes:
    - id: cob:httpx_code:attribute:code.test_links.reason
      name: reason
      description: imports_target (the test imports the file) or name_match (test_<name>.py matches <name>.py).
      column_id: cob:httpx_code:column:code.test_links.reason
  semantic_fks:
  - column_attribute_id: cob:httpx_code:attribute:code.files.file_id
    column_id: cob:httpx_code:column:code.headings.file_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.files.file_id
    column_id: cob:httpx_code:column:code.symbols.file_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.symbols.symbol_id
    column_id: cob:httpx_code:column:code.class_bases.class_symbol_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.symbols.symbol_id
    column_id: cob:httpx_code:column:code.class_bases.base_symbol_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.symbols.symbol_id
    column_id: cob:httpx_code:column:code.calls.caller_symbol_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.symbols.symbol_id
    column_id: cob:httpx_code:column:code.calls.callee_symbol_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.files.file_id
    column_id: cob:httpx_code:column:code.imports.file_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.files.file_id
    column_id: cob:httpx_code:column:code.imports.imported_file_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.files.file_id
    column_id: cob:httpx_code:column:code.test_links.test_file_id
    use_in_join_paths: true
  - column_attribute_id: cob:httpx_code:attribute:code.files.file_id
    column_id: cob:httpx_code:column:code.test_links.target_file_id
    use_in_join_paths: true
  sql_attributes:
    manual: []
    table: []
    sql: []
    bridge_table: []
  custom_analyses: []
zones: []
